# Local infrastructure for development: RabbitMQ and Redis.
# SQL Server runs as a local installation (see DEVELOPMENT.md).
#
# Credentials come from .env in this folder (Docker Compose reads it automatically);
# copy .env.example to .env and fill them in. Compose stops with a clear message if
# one is missing, rather than starting with a default password.

services:
  # RabbitMQ message broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: moviebooking-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moviebooking-network

  # Redis (seat locks)
  redis:
    image: redis:7-alpine
    container_name: moviebooking-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moviebooking-network

  # RedisInsight: browser GUI for inspecting Redis (keys, TTLs, live MONITOR)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: moviebooking-redis-insight
    ports:
      - '5540:5540'
    volumes:
      - redis_insight_data:/data
    depends_on:
      - redis
    networks:
      - moviebooking-network

volumes:
  rabbitmq_data:
  redis_data:
  redis_insight_data:

networks:
  moviebooking-network:
    driver: bridge
